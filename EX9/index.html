<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Flickr API 範例</title>
    <style>
        #gallery img {
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        #gallery img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h2>我的 Flickr 相簿</h2>
    <button onclick="getimg()">載入最新相片</button>
    <hr>
    <div id="gallery"></div>

    <script>
        // 1. 定義 Flickr API URL
        var imglist_Url = 'https://api.flickr.com/services/rest/?method=flickr.photos.getRecent&api_key=ca370d51a054836007519a00ff4ce59e&per_page=10&format=json&nojsoncallback=1';

        function getimg() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', imglist_Url, true);
            xhr.send();

            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(this.responseText);
                    // Flickr 的結構是 data.photos.photo (一個陣列)
                    add_new_img(data.photos.photo);
                } else {
                    console.error("無法取得資料");
                }
            };
        }

        function add_new_img(dataset) {
            var gal = document.getElementById("gallery");
            gal.innerHTML = ""; 

            dataset.forEach(function (item) {
               
                var server = item.server;
                var id = item.id;
                var secret = item.secret;
                var photoUrl = `https://live.staticflickr.com/${server}/${id}_${secret}_w.jpg`;

             
                var img = document.createElement("img");
                img.setAttribute("src", photoUrl);
                img.setAttribute("alt", item.title);
                img.style.margin = "10px";
                img.style.width = "200px";
                
                gal.appendChild(img);
            });
        }
    </script>
</body>
</html>
